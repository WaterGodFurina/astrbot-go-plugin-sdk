// AstrBot Go plugin service contract.
//
// This is the RPC boundary between the AstrBot host process and a plugin
// running as a subprocess (go-plugin, gRPC flavor). Plugin authors do NOT
// touch this file directly; they implement the `sdk.Plugin` struct and call
// `sdk.Serve(&plugin)`. The generated code under ../gen is produced with:
//
//	buf generate
//
// The heavy, platform-specific event/component payloads (message chains,
// metadata) cross the wire as `bytes` of JSON to keep the proto surface small
// and forward-compatible; the SDK (event.go) provides typed helpers.
//
// Bidirectional calls: the HOST serves HostService over the go-plugin gRPC
// broker (fixed AppID 9000). Plugins dial it lazily via the broker to call
// platform actions (OneBot API), send messages, or recall messages. The high
// AppID never collides with go-plugin's auto-incrementing NextId() stream
// (which starts low and is only used when a plugin implementation opts into
// the broker itself).
//
// EventResult is the extension point for handler outcomes: instead of piling
// more ad-hoc bool fields onto every response message, future semantics
// (blocked/consumed/etc.) are added as EventResult fields. Old plugin binaries
// (compiled against a proto without `result`) leave the field unset; hosts
// then fall back to the legacy bool fields (stop/sent/handled) that are kept
// for that exact reason. New plugin binaries fill BOTH the result sub-message
// and the legacy fields so old hosts keep working. Proto3 forward/backward
// compatibility rule: only append fields, never remove/reorder/rename.
syntax = "proto3";

package astrbot.sdk.v1;

option go_package = "github.com/WaterGodFurina/Astrbot-go-plugin-sdk/gen/sdkv1";

// HostServiceAppID is the fixed broker AppID of the HostService
// (9000). Define this constant in Go on both the SDK and host sides.
//
// PluginService is implemented by every plugin subprocess.
service PluginService {
  // Register returns plugin metadata and its handler descriptors.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // HandleCommand invokes a registered command handler.
  rpc HandleCommand(HandleCommandRequest) returns (HandleCommandResponse);
  // HandleFilter invokes a registered event filter.
  rpc HandleFilter(HandleFilterRequest) returns (HandleFilterResponse);
  // HandleHook invokes a registered lifecycle/pipeline hook.
  rpc HandleHook(HandleHookRequest) returns (HookResponse);
  // HandleLLMRequest invokes an on_llm_request hook, letting the plugin
  // inspect/modify the LLM system prompt before the provider call.
  rpc HandleLLMRequest(HandleLLMRequestRequest) returns (HandleLLMRequestResponse);
  // HandleTool invokes a registered LLM function tool.
  rpc HandleTool(HandleToolRequest) returns (HandleToolResponse);
  // ListTools returns the plugin's CURRENT LLM function tools. Plugin tools are
  // typically registered during instantiation (Context.add_llm_tools in
  // __init__/initialize), which happens AFTER Register — so the host pulls the
  // live tool list through this RPC instead of relying on the Register
  // snapshot (aligned with Python AstrBot's runtime tool collection).
  rpc ListTools(Empty) returns (ListToolsResponse);
  // HandleWebRequest dispatches a dashboard HTTP request to a plugin-registered
  // Web API (context.register_web_api / /api/plug/<path>).
  rpc HandleWebRequest(HandleWebRequestRequest) returns (HandleWebRequestResponse);
  // HealthCheck is used for keep-alive/readiness probing.
  rpc HealthCheck(Empty) returns (HealthResponse);
  // SetLogLevel adjusts the plugin's log level at runtime: the host's
  // per-plugin override (DEBUG/INFO/WARNING/ERROR/CRITICAL), or "" to
  // follow the host's global level. Old plugin binaries (compiled against
  // a proto without this RPC) return UNIMPLEMENTED; the host tolerates it.
  rpc SetLogLevel(SetLogLevelRequest) returns (Empty);
  // FeedSessionWait pushes an inbound message event to a plugin that
  // registered a session wait (session_waiter). Triggered by the host when
  // a message arrives for a waiting umo. The plugin feeds it into
  // SessionWaiter.trigger; if no wait matches it returns handled=false.
  rpc FeedSessionWait(FeedSessionWaitRequest) returns (FeedSessionWaitResponse);
  // Cleanup is called when the host unloads the plugin.
  rpc Cleanup(Empty) returns (Empty);
}

// HostService is served by the HOST and dialed by plugins for reverse calls.
service HostService {
  // CallAction forwards a platform API call (e.g. OneBot v11 call_action).
  rpc CallAction(CallActionRequest) returns (CallActionResponse);
  // SendMessage sends a message chain to a session (proactive/reactive send).
  rpc SendMessage(SendMessageRequest) returns (Empty);
  // RecallMessage recalls an already-sent message by platform message id.
  rpc RecallMessage(RecallMessageRequest) returns (Empty);
  // GetConfig returns the plugin's persisted config (plugins/<name>/config.json).
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // SetConfig persists the plugin's config (plugins/<name>/config.json).
  rpc SetConfig(SetConfigRequest) returns (Empty);
  // ChatLLM calls the host's default chat LLM provider and returns the reply.
  rpc ChatLLM(ChatLLMRequest) returns (ChatLLMResponse);
  // React adds an emoji reaction to a message (platforms supporting it).
  rpc React(ReactRequest) returns (Empty);
  // TextToImage renders text into an image (host t2i engine) and returns the
  // PNG bytes (base64). The plugin can then send it as an Image component.
  rpc TextToImage(TextToImageRequest) returns (TextToImageResponse);

  // ── 会话管理（对齐 Python AstrBot conversation_manager）──
  // 取会话当前 ID（umo 无会话时返回空串）。
  rpc GetCurrConversationID(ConversationIDRequest) returns (ConversationIDResponse);
  // 新建会话（设为当前）并返回其 ID。
  rpc NewConversation(NewConversationRequest) returns (ConversationIDResponse);
  // 按 umo+cid 取会话（create_if_not_exists 时不存在则新建）。
  rpc GetConversation(GetConversationRequest) returns (ConversationResponse);
  // 列出某 umo 的全部会话（无 umo 时列出全部）。
  rpc GetConversations(GetConversationsRequest) returns (ConversationsResponse);
  // 删除会话（按 umo+cid；cid 空时删除当前会话）。
  rpc DeleteConversation(DeleteConversationRequest) returns (Empty);
  // 切换当前会话（设置 umo 的 current cid）。
  rpc SwitchConversation(SwitchConversationRequest) returns (Empty);
  // 更新会话标题。
  rpc UpdateConversationTitle(UpdateConversationTitleRequest) returns (Empty);
  // 更新会话绑定的人格。
  rpc UpdateConversationPersonaID(UpdateConversationPersonaRequest) returns (Empty);

  // ── 人格管理（对齐 Python AstrBot persona_manager）──
  // 取全部人格。
  rpc GetPersonas(Empty) returns (PersonasResponse);
  // 取默认人格（按 umo 解析默认人格 id/name）。
  rpc GetDefaultPersona(GetDefaultPersonaRequest) returns (PersonaResponse);
  // 取文件夹树（嵌套结构）+ 全部人格。
  rpc GetPersonaTree(Empty) returns (PersonaTreeResponse);
  // 解析当前生效人格（会话/规则/默认的优先级合并）。
  rpc ResolveSelectedPersona(ResolvePersonaRequest) returns (ResolvePersonaResponse);

  // ── Provider 管理（对齐 Python AstrBot provider_manager）──
  // 列出全部 provider（按能力类型过滤，空=全部）。
  rpc ListProviders(ListProvidersRequest) returns (ProvidersResponse);
  // 取某 umo 当前使用的 provider（按能力类型）。
  rpc GetUsingProvider(GetUsingProviderRequest) returns (ProviderResponse);
  // 设置某 umo 的当前 provider。
  rpc SetProvider(SetProviderRequest) returns (Empty);
  // 取 provider 的模型列表。
  rpc GetProviderModels(GetProviderModelsRequest) returns (ProviderModelsResponse);

  // ── 插件/Star 管理（对齐 Python AstrBot star_manager）──
  // 列出全部已安装插件（Star 元数据）。
  rpc ListStars(Empty) returns (StarsResponse);
  // 按插件名取 Star 元数据。
  rpc GetStar(GetStarRequest) returns (StarResponse);
  // 启用/禁用插件。
  rpc SetPluginEnabled(SetPluginEnabledRequest) returns (Empty);
  // 安装插件（git/url 源）。
  rpc InstallPlugin(InstallPluginRequest) returns (Empty);
  // UninstallPlugin 卸载插件。
  rpc UninstallPlugin(UninstallPluginRequest) returns (Empty);

  // ── 会话等待（SessionWaiter 跨进程喂入）──
  // 插件注册"等待某 umo 的下一条消息"（session_waiter.register_wait）。
  // 宿主收到该 umo 的消息时经 PluginService.FeedSessionWait 推送事件。
  rpc RegisterSessionWait(RegisterSessionWaitRequest) returns (RegisterSessionWaitResponse);
  // 插件注销等待（会话结束/超时）。
  rpc UnregisterSessionWait(UnregisterSessionWaitRequest) returns (Empty);
}

message Empty {}

// EventResult aggregates the handler-outcome flags that used to be scattered
// bool fields on individual response messages (sent / stop / handled). It is
// the forward extension point: future semantics (blocked, consumed, ...) are
// added here instead of as more top-level bools. `skip_llm` is reserved for
// "do not invoke the LLM" (conceptually distinct from stop_propagation) and
// is currently only passed through — hosts that do not consume it ignore it.
message EventResult {
  // handler 产生了结果（例如回复链/文本/拒绝动作已产生）。
  bool handled = 1;
  // sent: the plugin performed a send operation during the handler
  // (Python _has_send_oper semantics). The host must not fall through to the
  // LLM when a reply was already produced this way.
  bool sent = 2;
  // stop_propagation: stop the pipeline from continuing (legacy `stop`).
  bool stop_propagation = 3;
  // skip_llm: reserved concept — skip the LLM call for this message.
  bool skip_llm = 4;
}

// CommandDesc describes a command the plugin accepts.
message CommandDesc {
  string name = 1;
  repeated string aliases = 2;
  string description = 3;
  string usage = 4;
  string permission = 5; // "everyone" | "admin"
}

// FilterDesc describes an event filter the plugin registers.
message FilterDesc {
  string name = 1;
}

// HookDesc describes a lifecycle/pipeline hook the plugin registers.
message HookDesc {
  string name = 1;
  string event = 2; // e.g. "startup", "on_message", "on_llm_response"
}

// ToolDesc describes an LLM function tool the plugin exposes to the model.
message ToolDesc {
  string name = 1;
  string description = 2;
  // JSON object schema of the tool parameters.
  bytes params_json = 3;
}

message RegisterRequest {}

// SetLogLevelRequest carries the desired log level name
// (DEBUG/INFO/WARNING/ERROR/CRITICAL) or "" to follow the host's global level.
message SetLogLevelRequest {
  string level = 1;
}

message RegisterResponse {
  string name = 1;
  string version = 2;
  string description = 3;
  string author = 4;
  repeated CommandDesc commands = 5;
  repeated FilterDesc filters = 6;
  repeated HookDesc hooks = 7;
  // JSON of the plugin's config schema (map[string]any).
  bytes config_schema_json = 8;
  repeated ToolDesc tools = 9;
  // Web APIs registered via context.register_web_api (Python SDK).
  repeated WebApiDesc web_apis = 10;
}

// WebApiDesc describes a Web UI API route a plugin registered
// (context.register_web_api). The host proxies /api/plug/<plugin>/<route>
// requests to the plugin process, which matches the route (including dynamic
// <param> segments) and runs the handler.
message WebApiDesc {
  // Route pattern like "/meme_manager/emoji/<category>" (or without the
  // leading plugin segment).
  string route = 1;
  repeated string methods = 2;
  string description = 3;
}

message WebKV {
  string key = 1;
  string value = 2;
}

message WebUploadFile {
  string field = 1;
  string filename = 2;
  string content_type = 3;
  bytes content = 4;
}

message HandleWebRequestRequest {
  string method = 1;
  // Sub-path after /api/plug/<plugin_name>/ (e.g. "emoji/happy").
  string path = 2;
  // Multi-value query string pairs.
  repeated WebKV query = 3;
  repeated WebKV headers = 4;
  bytes body = 5;
  repeated WebUploadFile files = 6;
}

message HandleWebRequestResponse {
  int32 status_code = 1;
  repeated WebKV headers = 2;
  bytes body = 3;
}

message HandleCommandRequest {
  string name = 1;
  repeated string args = 2;
  // JSON of sdk.Event.
  bytes event_json = 3;
}

message HandleCommandResponse {
  string text = 1;
  // JSON of []sdk.Component (optional richer result chain).
  bytes chain_json = 2;
  bool stop = 3;
  // sent: the plugin performed a send operation during the handler (Python
  // AstrBot _has_send_oper semantics). The host must not fall through to the
  // LLM when the command already produced a reply this way.
  bool sent = 4;
  // EventResult aggregates the outcome flags; hosts read from `result` and
  // fall back to the legacy fields above when it is absent (old binaries).
  EventResult result = 5;
}

message HandleFilterRequest {
  string name = 1;
  // JSON of sdk.Event.
  bytes event_json = 2;
}

message HandleFilterResponse {
  bool allow = 1;
  // sent: the plugin sent a message while running the filter.
  bool sent = 2;
  // EventResult aggregates the outcome flags (legacy fallback: sent).
  EventResult result = 3;
}

message HandleHookRequest {
  string name = 1;
  // JSON of sdk.Event.
  bytes event_json = 2;
  // JSON of []sdk.Component (current result chain for decoration hooks).
  bytes chain_json = 3;
  // JSON of the hook-specific payload (e.g. sdk.LLMResponse for
  // on_llm_response, sdk.ToolCall for on_using_llm_tool/on_llm_tool_respond,
  // sdk.PluginError for on_plugin_error). Empty for hooks that only need the
  // event (on_message / on_waiting_llm_request / lifecycle hooks).
  bytes payload_json = 4;
}

// HookResponse replaces Empty as the HandleHook return value so hooks can
// decorate the outgoing reply chain and/or stop the pipeline.
message HookResponse {
  // JSON of []sdk.Component (result chain decoration).
  bytes chain_json = 1;
  bool stop = 2;
  bool handled = 3;
  // sent: the plugin sent a message while running the hook.
  bool sent = 4;
  // EventResult aggregates the outcome flags (legacy fallback: stop/handled/sent).
  EventResult result = 5;
}

message HandleLLMRequestRequest {
  string name = 1;
  // JSON of sdk.Event.
  bytes event_json = 2;
  // Current system prompt (may be modified by the plugin).
  string system_prompt = 3;
  // User prompt being sent to the model.
  string user_prompt = 4;
}

message HandleLLMRequestResponse {
  // (Possibly modified) system prompt.
  string system_prompt = 1;
  // Stop: do not call the LLM for this message.
  bool stop = 2;
  // sent: the plugin sent a message while running the hook.
  bool sent = 3;
  // EventResult aggregates the outcome flags (legacy fallback: stop/sent).
  EventResult result = 4;
}

message HandleToolRequest {
  string name = 1;
  // JSON of the tool arguments (map[string]any).
  bytes args_json = 2;
  // JSON of sdk.Event.
  bytes event_json = 3;
}

message HandleToolResponse {
  // Text result fed back to the model as the tool message.
  string text = 1;
  bool is_error = 2;
  // sent: the plugin sent a message while running the tool.
  bool sent = 3;
  // EventResult aggregates the outcome flags (legacy fallback: sent).
  EventResult result = 4;
}

message ListToolsResponse {
  repeated ToolDesc tools = 1;
}

message HealthResponse {
  bool ok = 1;
  double load = 2;
  string version = 3;
}

// --- HostService payloads --------------------------------------------------

message CallActionRequest {
  // Platform adapter id (e.g. "aiocqhttp"). Empty = any adapter.
  string platform = 1;
  // OneBot v11 API name, e.g. "get_group_member_info".
  string api = 2;
  // JSON object of action params.
  bytes params_json = 3;
}

message CallActionResponse {
  // JSON object returned by the platform (data field unwrapped).
  bytes result_json = 1;
}

message SendMessageRequest {
  // Platform adapter id (e.g. "aiocqhttp").
  string platform = 1;
  // Conversation id (group id or friend user id).
  string session_id = 2;
  // JSON of []sdk.Component.
  bytes chain_json = 3;
}

message RecallMessageRequest {
  // Platform adapter id.
  string platform = 1;
  // Platform message id to recall.
  string message_id = 2;
}

message GetConfigRequest {
  // Plugin name (the value returned by Register).
  string plugin_name = 1;
}

message GetConfigResponse {
  // JSON object of the plugin's persisted config.
  bytes config_json = 1;
}

message SetConfigRequest {
  // Plugin name (the value returned by Register).
  string plugin_name = 1;
  // JSON object of the full config to persist.
  bytes config_json = 2;
}

message ChatLLMRequest {
  // User prompt sent to the model.
  string prompt = 1;
  // Optional system prompt prepended to the request.
  string system_prompt = 2;
  // Optional session id (unified message origin) used to resolve the session's
  // preferred provider. Empty = default provider.
  string session_id = 3;
  // Optional image URLs/paths/base64 appended to the user message
  // (multimodal request).
  repeated string image_urls = 4;
}

message ChatLLMResponse {
  // The model's reply text.
  string text = 1;
}

message ReactRequest {
  // Platform adapter id (e.g. "qq_official").
  string platform = 1;
  // Conversation id (group id or friend user id).
  string session_id = 2;
  // Platform message id to react to.
  string message_id = 3;
  // Emoji to add (e.g. "👍").
  string emoji = 4;
}

message TextToImageRequest {
  // Text to render into an image.
  string text = 1;
  // Optional t2i template name (host-dependent; empty = default).
  string template_name = 2;
}

message TextToImageResponse {
  // PNG image bytes, base64-encoded (no data: prefix).
  string image_base64 = 1;
}

// --- Conversation management payloads ---------------------------------------

message ConversationIDRequest {
  string unified_msg_origin = 1;
}

message ConversationIDResponse {
  string cid = 1;
}

message NewConversationRequest {
  string unified_msg_origin = 1;
  string platform_id = 2;
  string persona_id = 3;
}

message GetConversationRequest {
  string unified_msg_origin = 1;
  string conversation_id = 2;
  bool create_if_not_exists = 3;
}

message ConversationResponse {
  // JSON of the conversation (cid/title/persona_id/history/updated_at/...).
  bytes conversation_json = 1;
}

message GetConversationsRequest {
  string unified_msg_origin = 1; // empty = all
}

message ConversationsResponse {
  repeated bytes conversations_json = 1; // JSON per conversation
}

message DeleteConversationRequest {
  string unified_msg_origin = 1;
  string conversation_id = 2; // empty = current
}

message SwitchConversationRequest {
  string unified_msg_origin = 1;
  string conversation_id = 2;
}

message UpdateConversationTitleRequest {
  string unified_msg_origin = 1;
  string conversation_id = 2; // empty = current
  string title = 3;
}

message UpdateConversationPersonaRequest {
  string unified_msg_origin = 1;
  string conversation_id = 2; // empty = current
  string persona_id = 3;
}

// --- Persona management payloads --------------------------------------------

message PersonaPayload {
  string id = 1;
  string name = 2;
  string prompt = 3;
  bool is_default = 4;
  string folder_id = 5;
}

message GetDefaultPersonaRequest {
  string umo = 1;
}

message PersonaResponse {
  bytes persona_json = 1; // JSON of PersonaPayload
}

message PersonasResponse {
  repeated bytes personas_json = 1;
}

message PersonaTreeResponse {
  repeated bytes folders_json = 1; // nested {name,folder_id,children}
  repeated bytes personas_json = 2; // flat PersonaPayload list
}

message ResolvePersonaRequest {
  string umo = 1;
  string conversation_persona_id = 2;
  string platform_name = 3;
  bytes provider_settings_json = 4; // JSON of provider_settings map
}

message ResolvePersonaResponse {
  string persona_id = 1;
  string persona_name = 2;
  string persona_prompt = 3;
  string force_applied_persona_id = 4;
  bool is_default = 5;
}

// --- Provider management payloads -------------------------------------------

message ListProvidersRequest {
  // capability filter: chat_completion | text_to_speech | speech_to_text |
  // embedding | rerank. Empty = all.
  string capability = 1;
}

message ProviderPayload {
  string id = 1;
  string model = 2;
  string type = 3; // adapter name (openai, ollama, ...)
  string provider_type = 4; // capability
  string desc = 5;
}

message ProvidersResponse {
  repeated bytes providers_json = 1; // JSON of ProviderPayload
}

message GetUsingProviderRequest {
  string umo = 1;
  string capability = 2; // empty = chat_completion
}

message ProviderResponse {
  bytes provider_json = 1; // JSON of ProviderPayload
}

message SetProviderRequest {
  string umo = 1;
  string provider_id = 2;
  string capability = 3; // empty = chat_completion
}

message GetProviderModelsRequest {
  string provider_id = 1;
}

message ProviderModelsResponse {
  repeated string models = 1;
}

// --- Plugin/Star management payloads ----------------------------------------

message StarPayload {
  string name = 1;
  string author = 2;
  string desc = 3;
  string version = 4;
  string module_path = 5;
  bool activated = 6;
  string repo = 7;
}

message GetStarRequest {
  string name = 1;
}

message StarsResponse {
  repeated bytes stars_json = 1; // JSON of StarPayload
}

message StarResponse {
  bytes star_json = 1; // JSON of StarPayload
}

message SetPluginEnabledRequest {
  string plugin_name = 1;
  bool enabled = 2;
}

message InstallPluginRequest {
  string repo = 1; // git url / plugin name
}

message UninstallPluginRequest {
  string plugin_name = 1;
}

// --- Session wait payloads --------------------------------------------------

message RegisterSessionWaitRequest {
  // Unified message origin the plugin waits on (e.g. "aiocqhttp:GroupMessage:123").
  string umo = 1;
  // Timeout seconds after which the wait expires (host does not push events).
  int32 timeout_seconds = 2;
}

message RegisterSessionWaitResponse {
  // Host-assigned wait id, used by UnregisterSessionWait.
  string wait_id = 1;
}

message UnregisterSessionWaitRequest {
  string wait_id = 1;
}

message FeedSessionWaitRequest {
  // JSON of sdk.Event (same encoding as HandleFilter's event_json).
  bytes event_json = 1;
}

message FeedSessionWaitResponse {
  // Whether a registered wait consumed this event.
  bool handled = 1;
}
